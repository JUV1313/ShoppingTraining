  top: 50%;
  width: 40%;
  height: 1px;
  background: #e0e0e0;
}

}

.divider::after {

}

.cart-nav-btn {

}

.cart-count-badge {

@media (max-width: 768px) {

  }

  }
}

const categories = ["הכל", "סופרמרקט", "מוצרי חשמל", "בריאות וטיפוח", "ביגוד"];

document.addEventListener("DOMContentLoaded", () => {
  setupHeaderEvents();
  renderView("home");
  updateCartCountBadge();
});

function setupHeaderEvents() {
  const navButtons = document.querySelectorAll(".nav-btn");
  navButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      const view = btn.dataset.view;
      if (view === "catalog") {
        renderView("catalog");
      } else if (view === "cart") {
        renderView("cart");
      } else {
        renderView("home");
      }
    });
  });

  const loginBtn = document.getElementById("login-btn");
  loginBtn.addEventListener("click", openLoginModal);

  document.getElementById("close-login-modal").addEventListener("click", closeLoginModal);

  document.getElementById("fake-google-btn").addEventListener("click", () => {
    state.user = {
      name: "מתרגלת גוגל",
      email: "example.user@gmail.com"
    };
    updateUserGreeting();
    updateCartCountBadge();
    closeLoginModal();
    renderView("catalog");
  });

  document.getElementById("manual-login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("login-name").value.trim();
    const email = document.getElementById("login-email").value.trim();
    if (!name || !email) return;
    state.user = { name, email };
    updateUserGreeting();
    updateCartCountBadge();
    closeLoginModal();
    renderView("catalog");
  });

  updateUserGreeting();
  updateCartCountBadge();
}

function openLoginModal() {
  document.getElementById("login-modal").classList.remove("hidden");
}

function closeLoginModal() {
  document.getElementById("login-modal").classList.add("hidden");
}

function updateUserGreeting() {
  const span = document.getElementById("user-greeting");
  const loginBtn = document.getElementById("login-btn");
  if (state.user) {
    span.textContent = `שלום, ${state.user.name}`;
    loginBtn.textContent = "החלפת משתמש";
  } else {
    span.textContent = "";
    loginBtn.textContent = "התחברות";
  }
}

function updateCartCountBadge() {
  const badge = document.getElementById("cart-count-badge");
  if (!badge) return;
  const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = "inline-flex";
  } else {
    badge.style.display = "none";
  }
}

function renderView(view) {
  const root = document.getElementById("app-root");
  if (view === "home") {
    root.innerHTML = buildHomeView();
    const startBtn = document.getElementById("start-training-btn");
    startBtn.addEventListener("click", () => {
      if (!state.user) {
        openLoginModal();
      } else {
        renderView("catalog");
      }
    });
  } else if (view === "catalog") {
    root.innerHTML = buildCatalogView();
    setupCatalogEvents();
  } else if (view === "cart") {
    root.innerHTML = buildCartView();
    setupCartEvents();
  } else if (view === "checkout") {
    root.innerHTML = buildCheckoutView();
    setupCheckoutEvents();
  } else if (view === "thankyou") {
    root.innerHTML = buildThankyouView();
    setupThankyouEvents();
  }
}

function buildHomeView() {
  return `

          הכל בצורה בטוחה לצורכי תרגול בלבד.
        </p>

        <p><strong>בסדנה אפשר לתרגל נושאים כגון:</strong></p>
        <ul class="hero-list">
          <li>השוואת מחירים בין מוצרים דומים</li>
          <li>הבנת עגלת הקניות והוספה או הורדה של פריטים</li>
          <li>מילוי נכון של כתובת למשלוח ופרטי קשר</li>
          <li>הכנסת פרטי כרטיס אשראי מדומה לצורכי תרגול בלבד</li>
          <li>שיחה על בטיחות, סימני אזהרה ואתרי קניות אמינים</li>
        </ul>
      </div>
    </section>
    <section>
      <h3 class="section-title">איך זה עובד בקצרה</h3>
      <div class="info-card">
        <ul>
          <li>נרשמים לתרגול עם שם ואימייל, אפשר גם עם "חיבור גוגל" מדומה.</li>
          <li>בוחרים מוצרים לדוגמה לפי קטגוריות ומוסיפים לעגלה.</li>
          <li>ממשיכים למסך תשלום ומתרגלים מילוי פרטים ופרטי כרטיס פיקטיבי.</li>
          <li>מגיעים למסך "תודה שקנית", ורואים סיכום הזמנה.</li>
          <li>הכל תרגול בלבד, אין חיוב אמיתי ואין שמירת נתוני כרטיס.</li>
        </ul>
      </div>
    </section>
  `;
}

function buildCatalogView() {
  const categoryChips = categories.map(cat => {
    return `<button class="category-chip${cat === "הכל" ? " active" : ""}" data-category="${cat}">${cat}</button>`;
  }).join("");

  const productsHtml = buildProductsGrid("הכל");

  return `
    <section>
      <h2 class="section-title">בחירת מוצרים לדוגמה</h2>
      <p>בחרו קטגוריה והוסיפו מוצרים לעגלת הקניות, לצורכי תרגול בלבד.</p>
      <div class="categories-row">
        ${categoryChips}
      </div>
      <div id="products-grid" class="products-grid">
        ${productsHtml}
      </div>
    </section>
  `;
}

function buildProductsGrid(category) {
  const items = state.products.filter(p => category === "הכל" || p.category === category);
  if (!items.length) {
    return `<p>לא נמצאו מוצרים בקטגוריה זו.</p>`;
  }
  return items.map(p => {
    return `
      <article class="product-card" data-id="${p.id}">
        <div class="product-image">
          ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy" />` : p.icon}
        </div>
        <div class="product-name">${p.name}</div>
        <div class="product-meta">
          <span>${p.category}</span>
          <span class="price-text">${p.price.toFixed(1)} ₪</span>
        </div>
        <button class="add-btn" data-id="${p.id}">הוספה לעגלה</button>
      </article>
    `;
  }).join("");
}

function setupCatalogEvents() {
  const chips = document.querySelectorAll(".category-chip");
  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      chips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      const category = chip.dataset.category;
      const grid = document.getElementById("products-grid");
      grid.innerHTML = buildProductsGrid(category);
      attachAddToCartButtons();
    });
  });
  attachAddToCartButtons();
}

function attachAddToCartButtons() {
  const buttons = document.querySelectorAll(".add-btn");
  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.id);
      addToCart(id);
    });
  });
}

function addToCart(productId) {
  const existing = state.cart.find(item => item.id === productId);
  if (existing) {
    existing.qty += 1;
  } else {
    const product = state.products.find(p => p.id === productId);
    state.cart.push({ ...product, qty: 1 });
  }
  alert("המוצר נוסף לעגלה לצורכי תרגול");
  updateCartCountBadge();
}

function buildCartView() {
  const hasItems = state.cart.length > 0;
  const itemsHtml = hasItems ? state.cart.map(item => {
    const lineTotal = item.price * item.qty;
    return `
      <div class="cart-item" data-id="${item.id}">
        <div>
          <div class="cart-name">${item.name}</div>
          <div style="font-size:0.8rem; color:#777;">${item.category}</div>
        </div>
        <div>
          <div class="cart-qty-controls">
            <button class="qty-btn" data-action="minus">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" data-action="plus">+</button>
          </div>
        </div>
        <div style="text-align:left; font-size:0.85rem;">
          ${(lineTotal).toFixed(1)} ₪
        </div>
      </div>
    `;
  }).join("") : `<p>העגלה ריקה כרגע, אפשר לבחור מוצרים בדף הקטגוריות.</p>`;

  const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const itemsCount = state.cart.reduce((sum, item) => sum + item.qty, 0);

  return `
    <section>
      <h2 class="section-title">עגלת קניות לדוגמה</h2>
      <div class="cart-layout">
        <div class="cart-list">
          ${itemsHtml}
        </div>
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span>מספר פריטים בסך הכל</span>
            <span>${itemsCount}</span>
          </div>
          <div class="cart-summary-row">
            <span>סכום ביניים</span>
            <span>${total.toFixed(1)} ₪</span>
          </div>
          <div class="cart-summary-row">
            <span>דמי משלוח לדוגמה</span>
            <span>${total > 150 ? "חינם" : "15.0 ₪"}</span>
          </div>
          <div class="cart-summary-total">
            <span>סכום לתשלום לדוגמה</span>
            <span>${(total + (total > 150 || total === 0 ? 0 : 15)).toFixed(1)} ₪</span>
          </div>
          <button class="primary-btn full-width small-top" ${hasItems ? "" : "disabled"} id="go-to-checkout">
            המשך לתשלום לדוגמה
          </button>
          <button class="secondary-btn full-width small-top" onclick="renderView('catalog')">
            חזרה לבחירת מוצרים
          </button>
          <div class="info-card" style="margin-top:0.8rem;">
            <strong>לתשומת לבכם:</strong>
            <p style="margin:0.4rem 0 0; font-size:0.8rem;">
              המספרים כאן לדוגמה בלבד. אפשר להשתמש בעגלה כדי לתרגל בדיקה של הסכום הסופי, להבין השפעת דמי משלוח, ולדבר על קניות חכמות.
            </p>
          </div>
        </div>
      </div>
    </section>
  `;
}

function setupCartEvents() {
  const goToCheckout = document.getElementById("go-to-checkout");
  if (goToCheckout) {
    goToCheckout.addEventListener("click", () => {
      if (!state.user) {
        alert("כדי להמשיך לתשלום, יש להתחבר לתרגול.");
        openLoginModal();
      } else {
        renderView("checkout");
      }
    });
  }

  document.querySelectorAll(".cart-item").forEach(itemEl => {
    const id = Number(itemEl.dataset.id);
    itemEl.querySelectorAll(".qty-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        const item = state.cart.find(i => i.id === id);
        if (!item) return;
        if (action === "plus") {
          item.qty += 1;
        } else if (action === "minus") {
          item.qty -= 1;
          if (item.qty <= 0) {
            state.cart = state.cart.filter(i => i.id !== id);
          }
        }
        updateCartCountBadge();
        renderView("cart");
      });
    });
  });
}

function buildCheckoutView() {
  const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const shipping = total > 150 || total === 0 ? 0 : 15;
  const finalTotal = total + shipping;

  const name = state.user ? state.user.name : "";
  const email = state.user ? state.user.email : "";

  return `
    <section class="checkout-layout">
      <h2 class="section-title">מילוי פרטים ופרטי תשלום לדוגמה</h2>
      <p class="checkout-note">
        כאן מתרגלים מילוי כתובת ופרטי כרטיס אשראי מדומה. אין חיוב אמיתי, אין חיבור לחברת אשראי,
        והנתונים אינם נשמרים לצורכי תשלום.
      </p>
      <form id="checkout-form">
        <h3>פרטים אישיים וכתובת</h3>
        <div class="form-grid">
          <label>
            שם פרטי
            <input type="text" id="first-name" required value="${name}" />
          </label>
          <label>
            שם משפחה
            <input type="text" id="last-name" required />
          </label>
          <label>
            כתובת מלאה
            <input type="text" id="address" required />
          </label>
          <label>
            עיר
            <input type="text" id="city" required />
          </label>
          <label>
            טלפון
            <input type="tel" id="phone" required />
          </label>
          <label>
            אימייל לקבלת "קבלה"
            <input type="email" id="email" required value="${email}" />
          </label>
        </div>

        <h3 style="margin-top:1.2rem;">פרטי כרטיס אשראי מדומה לדוגמה</h3>
        <div class="form-grid">
          <label>
            מספר כרטיס (16 ספרות)
            <input type="text" id="card-number" inputmode="numeric" required placeholder="1234 5678 9012 3456" />
          </label>
          <label>
            תוקף (חודש/שנה)
            <input type="text" id="card-expiry" required placeholder="08/28" />
          </label>
          <label>
            3 ספרות בגב הכרטיס (CVV)
            <input type="text" id="card-cvv" inputmode="numeric" required placeholder="123" />
          </label>
        </div>

        <div class="info-card" style="margin-top:1rem;">
          <div class="cart-summary-row">
            <span>סכום המוצרים</span>
            <span>${total.toFixed(1)} ₪</span>
          </div>
          <div class="cart-summary-row">
            <span>דמי משלוח לדוגמה</span>
            <span>${shipping.toFixed(1)} ₪</span>
          </div>
          <div class="cart-summary-total">
            <span>סכום לתשלום לדוגמה</span>
            <span>${finalTotal.toFixed(1)} ₪</span>
          </div>
        </div>

        <button type="submit" class="primary-btn full-width small-top">
          אישור "תשלום" וסיום תרגול
        </button>
      </form>
    </section>
  `;
}

function setupCheckoutEvents() {
  const form = document.getElementById("checkout-form");
  const cardNumberInput = document.getElementById("card-number");
  const cardExpiryInput = document.getElementById("card-expiry");
  const cardCvvInput = document.getElementById("card-cvv");

  function toggleError(inputEl, hasError) {
    if (!inputEl) return;
    if (hasError) {
      inputEl.classList.add("input-error");
    } else {
      inputEl.classList.remove("input-error");
    }
  }

  function cleanCardNumber(value) {
    return value.replace(/\D/g, "").slice(0, 16);
  }

  function formatCardNumber(value) {
    const digits = cleanCardNumber(value);
    return digits.replace(/(.{4})/g, "$1 ").trim();
  }

  function validateCardNumber() {
    if (!cardNumberInput) return false;
    const digits = cleanCardNumber(cardNumberInput.value);
    const valid = /^[0-9]{16}$/.test(digits);
    toggleError(cardNumberInput, !valid);
    return valid;
  }

  function validateExpiry() {
    if (!cardExpiryInput) return false;
    let v = cardExpiryInput.value.replace(/\s/g, "");
    v = v.replace(/[^\d/]/g, "");
    if (v.length === 2 && !v.includes("/")) {
      v = v + "/";
    }
    if (v.length > 5) v = v.slice(0, 5);
    cardExpiryInput.value = v;
    const valid = /^(0[1-9]|1[0-2])\/\d{2}$/.test(v);
    toggleError(cardExpiryInput, !valid);
    return valid;
  }

  function validateCvv() {
    if (!cardCvvInput) return false;
    let v = cardCvvInput.value.replace(/\D/g, "").slice(0, 3);
    cardCvvInput.value = v;
    const valid = /^[0-9]{3}$/.test(v);
    toggleError(cardCvvInput, !valid);
    return valid;
  }

  // ולידציה חיה בזמן הקלדה
  if (cardNumberInput) {
    cardNumberInput.addEventListener("input", () => {
      cardNumberInput.value = formatCardNumber(cardNumberInput.value);
      validateCardNumber();
    });
  }

  if (cardExpiryInput) {
    cardExpiryInput.addEventListener("input", () => {
      validateExpiry();
    });
  }

  if (cardCvvInput) {
    cardCvvInput.addEventListener("input", () => {
      validateCvv();
    });
  }

  // חסימה ב-submit אם יש שגיאות
  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const cardOk = validateCardNumber();
    const expiryOk = validateExpiry();
    const cvvOk = validateCvv();

    if (!cardOk || !expiryOk || !cvvOk) {
      alert("לצורך התרגול, יש להכניס מספר כרטיס בן 16 ספרות, תוקף בפורמט חודש/שנה, ו 3 ספרות ב CVV. שדות שגויים מסומנים באדום.");
      return;
    }

    const firstName = document.getElementById("first-name").value.trim();
    const lastName = document.getElementById("last-name").value.trim();
    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value.trim();
    const city = document.getElementById("city").value.trim();

    state.lastOrderDetails = {
      firstName,
      lastName,
      email,
      address,
      city
    };

    renderView("thankyou");
  });
}


function buildThankyouView() {
  const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const shipping = total > 150 || total === 0 ? 0 : 15;
  const finalTotal = total + shipping;
  const details = state.lastOrderDetails || {};

  const itemsHtml = state.cart.map(item => {
    const lineTotal = item.price * item.qty;
    return `<li>${item.name} x ${item.qty} , סך הכל ${lineTotal.toFixed(1)} ₪</li>`;
  }).join("");

  return `
    <section class="thankyou-card">
      <h2>תודה שקנית באתר התרגול</h2>
      <p>
        ההזמנה המדומה שלך התקבלה. זו סימולציה לצורכי לימוד בלבד,
        אין חיוב אמיתי, הכרטיס הוא כרטיס אשראי מדומה ואין שמירת נתוני הכרטיס.
      </p>
      <div class="thankyou-details">
        <h3>סיכום הזמנה לדוגמה</h3>
        <ul>
          ${itemsHtml || "<li>לא נבחרו מוצרים, זוהי רק הדגמת מסך הסיכום.</li>"}
        </ul>
        <p><strong>סכום כולל לדוגמה:</strong> ${finalTotal.toFixed(1)} ₪</p>
        <p>
          <strong>ישלח מייל מדומה לכתובת:</strong>
          ${details.email || (state.user ? state.user.email : "example@demo.com")}
          <br />
          במערכת אמיתית זה היה דוח קבלה, כאן זה שימוש לצורכי תרגול בלבד.
        </p>
        <button class="primary-btn small-top" id="new-training-btn">
          התחלת תרגול חדש
        </button>
        <button class="secondary-btn small-top" onclick="renderView('catalog')">
          חזרה לבחירת מוצרים
        </button>
      </div>
    </section>
  `;
}

function setupThankyouEvents() {
  const btn = document.getElementById("new-training-btn");
  if (btn) {
    btn.addEventListener("click", () => {
      state.cart = [];
      updateCartCountBadge();
      renderView("catalog");
    });
  }
}
  </script>
